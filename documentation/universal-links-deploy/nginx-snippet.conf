# Universal Links / App Links для ucmatrix.org
# ================================================
# Добавить в server { ... } блок для домена ucmatrix.org
#
# Требования Apple/Google:
#   - HTTPS (валидный TLS-сертификат)
#   - HTTP 200 (без редиректов 301/302)
#   - Content-Type: application/json
#   - Без расширения .json у AASA-файла (важно!)
#   - Размер < 128 KB
#
# Предполагается, что директива `root` для server-блока указывает на каталог,
# в котором уже создана подпапка `.well-known/` с двумя файлами внутри:
#   <root>/.well-known/apple-app-site-association
#   <root>/.well-known/assetlinks.json

location = /.well-known/apple-app-site-association {
    default_type application/json;
    add_header Cache-Control "public, max-age=3600" always;
    # nginx сам отдаст файл из <root>/.well-known/apple-app-site-association
    # благодаря exact-match location и стандартному поведению static-файлов.
}

location = /.well-known/assetlinks.json {
    default_type application/json;
    add_header Cache-Control "public, max-age=3600" always;
}

# ВАЖНО:
#  1. Если /.well-known/ перехватывается выше по конфигу (часто для ACME / Let's Encrypt),
#     эти два location-блока должны быть определены ПОСЛЕ общего, иначе nginx
#     выберет более общий блок и выдаст файл с другим Content-Type.
#  2. Если ucmatrix.org проксируется через CDN (CloudFlare, CloudFront и т.п.),
#     убедитесь, что CDN не подменяет Content-Type и не добавляет редиректы.
#  3. После изменения конфига — `nginx -t && systemctl reload nginx`.
#
# ================================================
# Альтернативные веб-серверы (короткие шпаргалки):
# ================================================
#
# Apache (.htaccess или конфигурация виртуального хоста):
# ----
# <Files "apple-app-site-association">
#     ForceType application/json
#     Header set Cache-Control "public, max-age=3600"
# </Files>
# <Files "assetlinks.json">
#     ForceType application/json
#     Header set Cache-Control "public, max-age=3600"
# </Files>
#
# Caddy (Caddyfile):
# ----
# ucmatrix.org {
#     route /.well-known/apple-app-site-association {
#         header Content-Type application/json
#         file_server
#     }
#     route /.well-known/assetlinks.json {
#         header Content-Type application/json
#         file_server
#     }
# }
#
# AWS S3 + CloudFront:
# ----
# При загрузке файла в S3 указать Metadata: Content-Type = application/json
# (для apple-app-site-association — без расширения!).
# В CloudFront отключить query-string forwarding для этих путей и проверить,
# что behaviour не делает редиректов.
