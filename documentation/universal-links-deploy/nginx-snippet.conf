# Universal Links / App Links для ucmatrix.org
# Добавить в server { ... } блок для домена ucmatrix.org
#
# Требования Apple/Google:
#   - HTTPS (валидный TLS-сертификат)
#   - HTTP 200 (без редиректов 301/302)
#   - Content-Type: application/json
#   - Без расширения .json у AASA-файла (важно!)
#   - Размер < 128 KB

location = /.well-known/apple-app-site-association {
    default_type application/json;
    add_header Cache-Control "public, max-age=3600";
    try_files /.well-known/apple-app-site-association =404;
}

location = /.well-known/assetlinks.json {
    default_type application/json;
    add_header Cache-Control "public, max-age=3600";
    try_files /.well-known/assetlinks.json =404;
}

# Если /.well-known/ перехватывается выше по конфигу (например, для ACME/Let's Encrypt),
# убедитесь, что эти два location-блока определены ПОСЛЕ общего блока для /.well-known/
# или вынесены в отдельный server-блок.
